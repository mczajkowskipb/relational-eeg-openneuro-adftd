# Model configuration for the manuscript-specific OpenNeuro AD/FTD/CN EEG benchmark.
# The benchmark contains compact pairwise-rank models and conventional fast baselines.

relational_pairwise_rank:
  - id: TSP_k1
    family: compact_pairwise_rank
    k: 1
    disjoint: false

  - id: kTSP_k3_disjoint
    family: compact_pairwise_rank
    k: 3
    disjoint: true

  - id: kTSP_k5_disjoint
    family: compact_pairwise_rank
    k: 5
    disjoint: true

  - id: kTSP_k9_disjoint
    family: compact_pairwise_rank
    k: 9
    disjoint: true

  - id: kTSP_k3_nondisjoint
    family: compact_pairwise_rank
    k: 3
    disjoint: false

  - id: kTSP_k5_nondisjoint
    family: compact_pairwise_rank
    k: 5
    disjoint: false

  - id: kTSP_k9_nondisjoint
    family: compact_pairwise_rank
    k: 9
    disjoint: false

  - id: kTSP_CV_disjoint
    family: compact_pairwise_rank
    k: "selected_within_training"
    disjoint: true

  - id: kTSP_CV_nondisjoint
    family: compact_pairwise_rank
    k: "selected_within_training"
    disjoint: false

classic_fast:
  - majority
  - glmnet_ridge
  - glmnet_lasso
  - glmnet_elasticnet
  - svm_linear_liblinear
  - knn_euclidean
  - ranger_rf
  - xgboost_shallow
  - xgboost_default
  - sda_shrinklda
